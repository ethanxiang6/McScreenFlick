# Builds the Floating Lyrics mod that lives in the floatinglyrics/ folder.
# The Screen Flick mod at the repo root keeps its own "build" workflow.

name: floatinglyrics-build
on:
  push:
    paths:
      - 'floatinglyrics/**'
      - '.github/workflows/floatinglyrics.yml'
  pull_request:
    paths:
      - 'floatinglyrics/**'
      - '.github/workflows/floatinglyrics.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: floatinglyrics
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: floatinglyrics-jar
          path: floatinglyrics/build/libs/
